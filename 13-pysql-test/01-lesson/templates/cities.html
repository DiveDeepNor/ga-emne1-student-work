<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>World explorer</title>
</head>
<body>
<form action="/cities" method="get">
<label for="country">
Country code
</label>
<input id="country"
 name="country"
value="{{ code }}"
maxlength="3" required>
<button type="submit">Search</button>
</form>


<h1>Cities in {{ code }}</h1>
<ul>
{% for id, name, country, population in rows %}
    <li>
        <a href="/city/{{ id }}"> {{ name }} </a> – {{ country }} ({{ population }}) </li>
    {% else %}
<li>No cities found.</li>
{% endfor %}
</ul>
<a href="/">Home</a>


</body>
</html>
